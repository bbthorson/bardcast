<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bardcast hearth-mark: a waveform where one bar has caught fire, above the table line">
  <!-- The hearth-mark: three waveform bars in ember, the fourth caught fire in
       candle gold, all set above the table line. Colors are literals on purpose —
       this file must render outside any CSS context (favicons, feeds, embeds). -->
  <circle cx="48" cy="48" r="45" fill="none" stroke="#D9A441" stroke-width="2.5"/>
  <g fill="#E07B39">
    <rect x="26" y="52" width="7" height="14" rx="3.5"/>
    <rect x="38" y="46" width="7" height="20" rx="3.5"/>
    <rect x="63" y="52" width="7" height="14" rx="3.5"/>
  </g>
  <path d="M53.5 66 C46 60 47.5 51 53.5 44 C52 51 60 52 58.5 59 C57.6 63.3 55.8 65.2 53.5 66 Z" fill="#D9A441"/>
  <rect x="24" y="70" width="48" height="2.5" rx="1.25" fill="#D9A441" opacity="0.8"/>
</svg>
